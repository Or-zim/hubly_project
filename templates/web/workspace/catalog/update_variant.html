{% extends 'workspace_base.html' %}
{% load custom_filters %}

{% block workspace_content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="hub-form-card">
            <h2 class="hub-title">✏️ Редактирование варианта</h2>
            <p class="hub-subtitle">Измените характеристики для модели: <b>{{ product.name }}</b></p>

            <form method="post">
                {% csrf_token %}
                
                <!-- ХАРАКТЕРИСТИКИ ИЗ JSON -->
                <div class="p-4 rounded-4 mb-4 bg-dark border border-secondary border-opacity-25">
                    <span class="section-label text-primary">Характеристики</span>
                    <div class="row g-3">
                        {% for field in product.product_type.fields %}
                        <div class="col-md-6">
                            <label class="form-label small text-muted">{{ field.label }}</label>
                            <!-- ПОДСТАВЛЯЕМ СТАРОЕ ЗНАЧЕНИЕ ИЗ JSON -->
                            <input type="text" 
                                   name="field_{{ field.name }}" 
                                   class="form-control" 
                                   value="{{ variant.attributes|dict_get:field.name|default:'' }}" 
                                   required>
                        </div>
                        {% endfor %}
                    </div>
                </div>

                <!-- ЦЕНА И АРТИКУЛ -->
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="section-label">Цена (₽)</label>
                        <!-- ПОДСТАВЛЯЕМ СТАРУЮ ЦЕНУ -->
                        <input type="number" name="price" class="form-control" step="0.01" 
                               value="{{ variant.price|stringformat:'.2f' }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="section-label">Артикул / SKU</label>
                        <!-- ПОДСТАВЛЯЕМ СТАРЫЙ АРТИКУЛ -->
                        <input type="text" name="sku" class="form-control" value="{{ variant.sku }}">
                    </div>
                </div>

                <div class="d-flex justify-content-between pt-4 border-top border-secondary border-opacity-25">
                    <a href="{% url 'web:product_detail' business.id product.id %}" class="hub-btn hub-btn-ghost">Отмена</a>
                    <button type="submit" class="hub-btn hub-btn-primary px-5">Сохранить изменения</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
