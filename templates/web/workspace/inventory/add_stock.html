{% extends 'workspace_base.html' %}

{% block title %}Оформление поставки | Hubly{% endblock %}

{% block workspace_content %}
<div class="row justify-content-center mt-4 fade-in pb-5">
    <div class="col-md-10 col-lg-8">
        
        <div class="hub-form-card p-4 p-md-5" style="background: #0d0d0d; border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 20px 50px rgba(0,0,0,0.5);">
            
            <div class="mb-5 border-bottom border-secondary border-opacity-25 pb-4">
                <div class="d-flex align-items-center gap-3 mb-2">
                    <div class="icon-box mb-0" style="width: 48px; height: 48px; background: rgba(255,255,255,0.05); color: #fff;">
                        <i class="bi bi-box-arrow-in-down fs-4"></i>
                    </div>
                    <div>
                        <span class="section-label mb-1">Складская операция</span>
                        <h2 class="hub-title mb-0 text-white">Приход товара</h2>
                    </div>
                </div>
            </div>

            <form method="post">
                {% csrf_token %}

                <!-- ВЫБОР ТОВАРА -->
                <div class="mb-5">
                    <label class="section-label mb-3">Укажите номенклатуру</label>
                    <select name="variant" class="form-select form-select-lg" required style="background: #050505;">
                        <!-- Если selected_variant_id пустой, показываем заглушку -->
                        <option value="" disabled {% if not selected_variant_id %}selected{% endif %}>-- Выберите товар из списка --</option>
                        
                        {% for v in variants %}
                            <!-- ЕСЛИ ID СОВПАДАЮТ, ВЫБИРАЕМ ЭТОТ ТОВАР АВТОМАТИЧЕСКИ -->
                            <option value="{{ v.id }}" {% if selected_variant_id == v.id %}selected{% endif %}>
                                {{ v.product.name }} 
                                ({% for key, value in v.attributes.items %}{{ value }}{% if not forloop.last %}, {% endif %}{% endfor %}) 
                                — SKU: {{ v.sku }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="row g-4 mb-5">
                    <div class="col-md-5">
                        <label class="section-label mb-3">Количество (шт)</label>
                        <div class="input-group">
                            <span class="input-group-text border-secondary text-muted" style="background: #050505; border-color: rgba(255,255,255,0.08) !important;">
                                <i class="bi bi-plus-slash-minus"></i>
                            </span>
                            <input type="number" name="quantity" class="form-control form-control-lg border-start-0" placeholder="Напр: 50" min="1" required style="background: #050505; font-weight: 600;">
                        </div>
                    </div>
                    
                    <div class="col-md-7">
                        <label class="section-label mb-3">Основание / Источник</label>
                        <input type="text" name="reason" class="form-control form-control-lg" placeholder="Напр: Поставка от поставщика" style="background: #050505;">
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center border-top border-secondary border-opacity-25 pt-4 mt-2">
                    <a href="{% url 'web:inventory_list' business.id %}" class="hub-btn hub-btn-ghost px-4 py-3">
                        <i class="bi bi-arrow-left"></i> Отмена
                    </a>
                    <button type="submit" class="hub-btn hub-btn-primary px-5 py-3">
                        Оформить приход <i class="bi bi-check2-circle ms-2"></i>
                    </button>
                </div>

            </form>
        </div>

    </div>
</div>
{% endblock %}
